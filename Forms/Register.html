<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        #Register {
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            box-shadow: 0 0 8px rgb(109, 109, 109);
            width: 50vw;
            margin: auto;
            padding: 10px;
            font-size: 1.2vw;
        }

        #Register input,
        select,
        option {
            border: solid #ccc 1px;
            border-radius: 4px;
            height: 25px;
        }

        #Register button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #Register button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <form id="Register">
        <h2>Create an Account</h2>

        <label for="fullName">Full Name<sup>*</sup></label>
        <input type="text" id="fullName" name="fullName" required>
        <br>
        <label for="email">Email Address<sup>*</sup></label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="password">Password<sup>*</sup></label>
        <input type="password" id="password" name="password" required>
        <br>
        <label for="confirmPassword">Confirm Password<sup>*</sup></label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <br>
        <label for="phone">Phone Number<sup>*</sup></label>
        <input type="tel" id="phone" name="phone" required>
        <br>
        <label for="location">Location<sup>*</sup></label>
        <input type="text" id="location" name="location" placeholder="City, State, Country" required>
        <br>
        <label for="jobTitle">Job Title/Profession (optional)</label>
        <input type="text" id="jobTitle" name="jobTitle">
        <br>
        <label for="experienceLevel">Experience Level (optional)</label>
        <select id="experienceLevel" name="experienceLevel">
            <option value="select">Select</option>
            <option value="Entry-level">Entry-level</option>
            <option value="Mid-level">Mid-level</option>
            <option value="Senior">Senior</option>
        </select>
        <br>

        <label for="resumeGoal">Resume Goal (optional)</label>
        <input type="text" id="resumeGoal" name="resumeGoal" placeholder="e.g., Job Search, Career Change">
        <br>
        <span>
            <input type="checkbox" id="terms" name="terms" style="height: auto;" required>
            <label for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy
                    Policy</a></label>
        </span>
        <button type="submit">Register</button>
    </form>

</body>

</html>
